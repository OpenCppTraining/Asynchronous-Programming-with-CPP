repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # frozen: v6.0.0
    hooks:
      - id: detect-private-key
        name: Detect private keys (SSH/PGP/RSA)
      - id: check-merge-conflict
        name: Detect merge conflict markers
      - id: end-of-file-fixer
        name: Fix end of files
      - id: trailing-whitespace
        name: Remove trailing whitespace

  - repo: https://github.com/gitleaks/gitleaks
    rev: 83d9cd684c87d95d656c1458ef04895a7f1cbd8e # frozen: v8.30.1
    hooks:
      - id: gitleaks
        name: Gitleaks - secret detection

  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: a9a8a861f30ed207ead7d5a3b7e8032283ba5da7 # frozen: v23.1.2
    hooks:
      - id: clang-format
        name: clang-format - C++ formatting
        types_or: [c++, c]

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: a6564f5d57444e123433a5c9af733e3975c77229 # frozen: v0.11.0.1-1
    hooks:
      - id: shellcheck
        name: ShellCheck - shell linting

  - repo: https://github.com/adrienverge/yamllint
    rev: cba56bcde1fdd01c1deb3f945e69764c291a6530 # frozen: v1.38.0
    hooks:
      - id: yamllint
        name: yamllint - YAML linting

  - repo: local
    hooks:
      - id: cmake-format
        name: cmake-format - CMake formatting
        entry: cmake-format -i
        language: python
        additional_dependencies: ["cmake-format==0.6.13", "pyyaml"]
        types: [cmake]
